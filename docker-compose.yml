services:

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    command: ./entrypoint.sh daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8001:8000"
    volumes:
      - sqlite_data:/app/db_data
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - db_data/

  celery:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info --concurrency=1
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - sqlite_data:/app/db_data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: always
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - db_data/

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/

volumes:
  sqlite_data:
    name: project2_sqlite_data

networks:
  app-network:
    driver: bridge
